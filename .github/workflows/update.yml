# 定时更新站点数据：并行抓取三校 → 合并重建 index.html → 提交回 main 分支
# → GitHub Pages 检测到 main 推送自动发布（免费、不限部署次数）。
#
# 并行结构：
#   job "fetch" 用 matrix 同时跑 zju / sjtu / xjtu 三个校区（各自独立 runner），
#   每个腿只抓自己那一个校区，把 data/<校区>.json 与 _work/registry-<校区>.json
#   作为 artifact 上传；
#   job "build" 收齐这些 artifact，合并回工作区，统一重建 index.html，并 **只提交一次**。
#   → 总耗时约等于「最慢的单个校区」，而不是三校之和；单点提交也避免了并发写冲突。
#
# 注意：
# - 「清华知道」在本站是外链（点击直达 https://pkuknow.cn/thu），本站不抓取清华内容，
#   因此它不在下面的矩阵里 —— 顶栏仍显示该项，只是点开跳到外部站点。
# - GitHub 的 cron 用 UTC（比北京时间早 8 小时）：下面三个时刻 =
#   北京时间 09:00 / 12:00 / 22:00（对应 UTC 01:00 / 04:00 / 14:00）；
#   高峰期可能延迟几分钟到十几分钟触发，属正常现象。
# - 只抓网站内容，**不含**公众号后台（fetch_campus.py 里 kind=wechat 的来源已全部移除）。
#   公众号内容走「公开合集」这条零凭据通道：`python -m albums fetch` 只调
#   appmsgalbum 接口，不受账号级限流影响，因此可以安全地放进定时任务。
# - 合集增量放在 build job 里**顺序**跑，不塞进 fetch 矩阵：_work/albums/state.json
#   是单一文件（三校共用一份水位），三个腿并行各写一份会在 artifact 平铺时互相覆盖，
#   丢掉另外两个校区的水位。三校增量合计约 10 秒，没必要并行。
# - 浙大站群 WAF 按来源 IP 对整个 zju.edu.cn 域名累计限流，故 zju 腿用
#   --workers 2 + --domain-delay 1.0 + --rotate 压低速率；来源已精简到 6 个
#   （过去 44 个学院站），WAF 压力小得多。
# - 抓取脚本自带写入保护：某轮抓得不完整时保留旧数据，不会因网络故障写坏 data/*.json。
# - 运行器在境外（Azure），若某校站点限制境外 IP 导致某轮失败，下一轮自动重试。

name: 定时更新站点数据

on:
  schedule:
    - cron: "0 1 * * *"    # 北京时间 09:00
    - cron: "0 4 * * *"    # 北京时间 12:00
    - cron: "0 14 * * *"   # 北京时间 22:00
  workflow_dispatch:        # 允许在 Actions 页面手动触发

# 同一时刻只允许一轮更新在跑，避免定时与手动触发撞车
concurrency:
  group: site-update
  cancel-in-progress: false

permissions:
  contents: write           # 允许把更新后的数据提交回仓库

jobs:
  # ------------------------------------------------------------------
  # 并行抓取：每个校区一个独立 runner
  # ------------------------------------------------------------------
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false      # 某一校区失败不跳过其余校区，保证"能抓的照常更新"
      matrix:
        include:
          - campus: zju
            command: python fetch_campus.py --campus zju --workers 2 --delay 2.0 --domain-delay 1.0 --rotate --timeout 15 --retries 1 --no-build
          - campus: sjtu
            command: python fetch_campus.py --campus sjtu --workers 6 --delay 1.2 --timeout 12 --retries 1 --no-build
          - campus: xjtu
            command: python fetch_campus.py --campus xjtu --workers 6 --delay 1.2 --timeout 12 --retries 1 --no-build

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 每个腿只抓自己那个校区（--no-build：不重建页面，交给 build job 统一做）
      - name: 抓取 ${{ matrix.campus }}
        run: ${{ matrix.command }}

      # 数据与注册表交给 build job 合并；注册表让「只增不减」跨轮生效
      - name: 上传本校区产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.campus }}
          if-no-files-found: warn
          path: |
            data/${{ matrix.campus }}.json
            _work/registry-${{ matrix.campus }}.json

  # ------------------------------------------------------------------
  # 统一重建：收齐三校数据 → 重建 index.html 与按需分片 → 只提交一次
  # ------------------------------------------------------------------
  build:
    needs: fetch
    if: always()               # 有腿失败也照常重建，用已有数据出页面
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 收齐三校产物
        uses: actions/download-artifact@v4
        with:
          path: incoming

      # artifact 会各自解到一个子目录，平铺回 data/ 与 _work/
      - name: 合并回工作区
        run: |
          mkdir -p data _work
          find incoming -name '*.json' -path '*/data/*' -exec cp -v {} data/ \;
          find incoming -name '*.json' -path '*/_work/*' -exec cp -v {} _work/ \;

      # 公开合集增量：只看最近 60 天内有更新的合集（albums/albums.json 的 max_age_days），
      # 每个合集翻到上次的 msgid 水位就停。水位存在 _work/albums/state.json，跨轮靠缓存延续。
      # 缓存丢了也只是退回一次全量翻页（三校约 15 秒），不会漏也不会重复。
      # 允许失败：合集接口抽风不该连带这一轮的官网数据都出不了页面。
      - name: 恢复合集增量水位
        uses: actions/cache@v4
        with:
          path: _work/albums/state.json
          # 每轮都存一份新缓存（key 带 run_id），restore 时取最近的一份。
          # 不把 state.json 提交进仓库是因为它含 last_run 时间戳、每轮必变，
          # 入库等于每天多 3 个纯噪声提交。
          key: albums-state-${{ github.run_id }}
          restore-keys: |
            albums-state-

      - name: 公开合集增量
        continue-on-error: true
        run: python -m albums fetch --all

      # 合集产物 → 站点 item → 并入 data/<校区>.json。
      # --no-sogou / --no-seeds：云端只做「合集 → data」这一段。种子页每篇 3.5MB、
      # 搜狗会反爬并按分钟级签名失效，两者都是**人工扩量**用的，不适合放进定时任务。
      # 合并口径在 links/collect.py 的 merge_into_data：按 i 去重、只追加、写前留 .bak、
      # 只对公众号来源套 90 天保留期（官网条目的生命周期归 fetch_campus.py 管）。
      - name: 合集并入站点数据
        continue-on-error: true
        run: |
          python -m links harvest --all --no-sogou --no-seeds
          python -m links export --all --merge

      # 重建页面时会顺带写出 data/shard/*.json（首屏索引 + 按需分片）
      - name: 统一重建 index.html 与分片
        run: python refresh.py --build-only

      - name: 提交更新（有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/shard/*.json 必须一起提交：页面正文与切校区都靠它按需加载
          git add index.html data/*.json data/shard/*.json _work/registry-*.json
          if git diff --cached --quiet; then
            echo "本轮无内容变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 定时更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
