# 定时更新站点数据：抓取四校 → 重建 index.html → 提交回 main 分支
# → GitHub Pages 检测到 main 推送自动发布（免费、不限部署次数）。
#
# 托管说明：
# - 当前托管在 GitHub Pages（Settings → Pages → Deploy from a branch → main / root）。
# - netlify.toml 保留在仓库里：以后要切回 Netlify，连接仓库即可，无需改代码
#   （注意 Netlify 生产部署 15 积分/次，免费档 300 积分/月只够每天 1 次不到）。
#
# 注意：
# - GitHub 的 cron 使用 UTC（比北京时间早 8 小时），下面三个时刻 =
#   北京时间 09:00 / 12:00 / 22:00（对应 UTC 01:00 / 04:00 / 14:00）；
#   GitHub 在高峰期可能延迟几分钟到十几分钟触发，属正常现象。
# - ⚠️ 09:00 与 12:00 两轮只隔 3 小时（180 分钟），而单轮实测约 117 分钟，
#   余量约 1 小时，正常够用；但若某轮异常变慢导致后一轮触发时前一轮仍在跑，
#   后一轮会因 concurrency 排队**被跳过**（不是取消，是排不进）。
# - 实测耗时（2026-10-11 首轮成功运行）：清华 30 分 + 上交/西交 6 分 + 浙大 81 分
#   + 重建/提交 = 合计约 117 分钟。所以超时上限给到 240 分钟（GitHub 单任务上限 6 小时）。
#   浙大那 81 分钟是 WAF 对策（--workers 1）的代价，属预期。
# - 抓取脚本自带写入保护：某轮抓得不完整时会保留旧数据，
#   不会因为一轮网络故障把 data/*.json 写坏。
# - 运行器在境外（Azure），若高校站点对境外 IP 限制导致某轮失败，
#   下一轮会自动重试；持续失败再考虑切回本机定时任务。

name: 定时更新站点数据

on:
  schedule:
    - cron: "0 1 * * *"    # 北京时间 09:00
    - cron: "0 4 * * *"    # 北京时间 12:00
    - cron: "0 14 * * *"    # 北京时间 22:00
  workflow_dispatch:        # 允许在 Actions 页面手动触发

# 同一时刻只允许一个更新任务在跑，避免定时与手动触发撞车
concurrency:
  group: site-update
  cancel-in-progress: false

permissions:
  contents: write           # 允许把更新后的数据提交回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # 官网链路仅用标准库，无需安装任何依赖

      # 三个抓取步骤都加 if: always()：任一校区失败也不跳过其余校区，
      # 保证"能抓到的校区照常更新"，同时失败的步骤仍会让整轮标红（便于收邮件告警）。
      - name: 抓取清华（pkuknow.cn 聚合接口）
        if: always()
        run: python cloud_update.py --skip-campus

      - name: 抓取上交 / 西交（两校无限速问题，正常并发）
        if: always()
        run: python fetch_campus.py --campus sjtu,xjtu

      # 浙大站群 WAF 按来源 IP 对**整个 zju.edu.cn 域名**累计限流（2026-10-10 两轮实测：
      # 并发 4 路 34 源 403、单并发也有 25 源 403，且两轮被封的都是抓取顺序中段的同一批学院）。
      # 对策（fetch_campus.py 已内置）：
      #   --workers 1         单并发，压低总速率
      #   --delay 2.5         同主机间隔 2.5s
      #   --domain-delay 1.0  全 zju.edu.cn 子域聚合间隔 1s（WAF 计的是这个）
      #   --rotate            每轮按日期轮换抓取起点，即使仍触发封锁，
      #                       被封窗口每轮落在不同学院身上，几天内全部轮得到
      #   --max-per-source 10 日更频率下每源 10 条足够，少抓详情页 = 少触发限流
      # 耗时约 35~50 分钟。
      - name: 抓取浙大（单并发慢速 + 域名级限速 + 顺序轮换）
        if: always()
        run: python fetch_campus.py --campus zju --workers 1 --delay 2.5 --domain-delay 1.0 --rotate --max-per-source 10

      - name: 统一重建 index.html
        if: always()   # 即使某个校区抓取不完整，也用已有数据重建页面
        run: python refresh.py --build-only

      - name: 提交更新（有变化才提交）
        if: always()   # 抓取步骤标红（便于收到邮件告警）时也要提交部分成果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 用 -A 而不是逐个列路径：注册表文件缺失时 git add 会因 pathspec
          # 匹配不到而报 128、整轮白跑。.gitignore 已排除 cookies 等敏感文件。
          git add -A
          if git diff --cached --quiet; then
            echo "本轮无内容变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 定时更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
