<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>「西交知道」 XJTU Know</title>
<meta name="description" content="聚合浙江大学、上海交通大学、西安交通大学等高校的公开活动、招募、教务与校园通知，查看活动时间、地点和原文。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='9' fill='%2386539b'/%3E%3Ccircle cx='12' cy='14' r='2.4' fill='%23fff'/%3E%3Ccircle cx='20' cy='14' r='2.4' fill='%23fff'/%3E%3Cpath d='M11.5 20.5c1.4 2 2.9 3 4.5 3s3.1-1 4.5-3' stroke='%23fff' stroke-width='1.9' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   设计令牌 —— 复刻自 pkuknow.cn「清华知道」的 8 色 tone 体系
   ============================================================ */
:root{
  --font-sans:"Geist","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-numbers:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.22,.61,.36,1);

  --background:#faf8f6;
  --foreground:#2b2431;
  --card:#ffffff;
  --card-foreground:#2b2431;
  --muted:#f3efec;
  --muted-foreground:#6f6575;
  --border:#e7e1de;
  --input:#988aa3;
  --ring:#a779bb;
  --primary:#86539b;
  --primary-foreground:#fffaf7;
  --accent:#efe3f5;
  --accent-foreground:#613571;
  --danger:#b3455c;
  --shadow-sm:0 1px 2px rgba(43,36,49,.05);
  --shadow-md:0 6px 20px -6px rgba(43,36,49,.14);
  --shadow-lg:0 26px 60px -18px rgba(43,36,49,.34);

  --tone-water-ink:#405b93;  --tone-water-tint:#dce8fc;  --tone-water-surface:#f0f5ff;  --tone-water-edge:#d4dff1;
  --tone-lilac-ink:#745093;  --tone-lilac-tint:#eadcf5;  --tone-lilac-surface:#f7f1fc;  --tone-lilac-edge:#e5d8f0;
  --tone-peach-ink:#905132;  --tone-peach-tint:#ffe2d1;  --tone-peach-surface:#fff4ee;  --tone-peach-edge:#f0ddcf;
  --tone-amber-ink:#805c30;  --tone-amber-tint:#fbe7c4;  --tone-amber-surface:#fff8e9;  --tone-amber-edge:#eee2c8;
  --tone-ochre-ink:#806426;  --tone-ochre-tint:#f9edbd;  --tone-ochre-surface:#fffbea;  --tone-ochre-edge:#ebe3c6;
  --tone-rose-ink:#904768;   --tone-rose-tint:#f8dce9;   --tone-rose-surface:#fff1f7;   --tone-rose-edge:#eed6e3;
  --tone-iris-ink:#615b94;   --tone-iris-tint:#e3e0fa;   --tone-iris-surface:#f5f3ff;   --tone-iris-edge:#dddaf0;
  --tone-slate-ink:#456582;  --tone-slate-tint:#dcebf4;  --tone-slate-surface:#f1f7fc;  --tone-slate-edge:#d5e2eb;
}
html[data-theme=dark]{
  --background:#1a171e;
  --foreground:#f1edf5;
  --card:#241f2b;
  --card-foreground:#f1edf5;
  --muted:#2b2532;
  --muted-foreground:#a69daf;
  --border:#352e3d;
  --input:#aa90bb;
  --ring:#d9bdef;
  --primary:#dab7ef;
  --primary-foreground:#372040;
  --accent:#503d65;
  --accent-foreground:#f0ddff;
  --danger:#f0a0b4;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 6px 22px -8px rgba(0,0,0,.6);
  --shadow-lg:0 26px 60px -18px rgba(0,0,0,.7);

  --tone-water-ink:#c1d8ff;  --tone-water-tint:#415778;  --tone-water-surface:#303b53;  --tone-water-edge:#485b79;
  --tone-lilac-ink:#e0c0f5;  --tone-lilac-tint:#584669;  --tone-lilac-surface:#3a324b;  --tone-lilac-edge:#635171;
  --tone-peach-ink:#ffd0b5;  --tone-peach-tint:#6a4d46;  --tone-peach-surface:#45373b;  --tone-peach-edge:#74574e;
  --tone-amber-ink:#f8d4a7;  --tone-amber-tint:#625343;  --tone-amber-surface:#3f383d;  --tone-amber-edge:#71604d;
  --tone-ochre-ink:#f7e2a0;  --tone-ochre-tint:#605940;  --tone-ochre-surface:#3d3c3c;  --tone-ochre-edge:#6e674c;
  --tone-rose-ink:#f9c3db;   --tone-rose-tint:#66445c;   --tone-rose-surface:#423247;   --tone-rose-edge:#75536a;
  --tone-iris-ink:#d7ceff;   --tone-iris-tint:#514c75;   --tone-iris-surface:#36354f;   --tone-iris-edge:#645d81;
  --tone-slate-ink:#c5ddeb;  --tone-slate-tint:#475b71;  --tone-slate-surface:#333c4e;  --tone-slate-edge:#566d83;
}
[data-tone=water]{--tone-ink:var(--tone-water-ink);--tone-tint:var(--tone-water-tint);--tone-surface:var(--tone-water-surface);--tone-edge:var(--tone-water-edge)}
[data-tone=lilac]{--tone-ink:var(--tone-lilac-ink);--tone-tint:var(--tone-lilac-tint);--tone-surface:var(--tone-lilac-surface);--tone-edge:var(--tone-lilac-edge)}
[data-tone=peach]{--tone-ink:var(--tone-peach-ink);--tone-tint:var(--tone-peach-tint);--tone-surface:var(--tone-peach-surface);--tone-edge:var(--tone-peach-edge)}
[data-tone=amber]{--tone-ink:var(--tone-amber-ink);--tone-tint:var(--tone-amber-tint);--tone-surface:var(--tone-amber-surface);--tone-edge:var(--tone-amber-edge)}
[data-tone=ochre]{--tone-ink:var(--tone-ochre-ink);--tone-tint:var(--tone-ochre-tint);--tone-surface:var(--tone-ochre-surface);--tone-edge:var(--tone-ochre-edge)}
[data-tone=rose]{--tone-ink:var(--tone-rose-ink);--tone-tint:var(--tone-rose-tint);--tone-surface:var(--tone-rose-surface);--tone-edge:var(--tone-rose-edge)}
[data-tone=iris]{--tone-ink:var(--tone-iris-ink);--tone-tint:var(--tone-iris-tint);--tone-surface:var(--tone-iris-surface);--tone-edge:var(--tone-iris-edge)}
[data-tone=slate]{--tone-ink:var(--tone-slate-ink);--tone-tint:var(--tone-slate-tint);--tone-surface:var(--tone-slate-surface);--tone-edge:var(--tone-slate-edge)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
::selection{background:var(--accent);color:var(--accent-foreground)}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
/* 作者样式的 display 会盖掉浏览器默认的 [hidden]{display:none},这里统一兜底 */
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;top:-60px;left:14px;z-index:200;padding:10px 16px;border-radius:0 0 12px 12px;background:var(--primary);color:var(--primary-foreground);font-size:13px;transition:top .2s}
.skip-link:focus{top:0}
.app-shell{min-height:100dvh;display:flex;flex-direction:column}

/* ============ 顶栏 ============ */
.masthead{background:var(--card);border-bottom:1px solid var(--border);position:relative;z-index:30}
.campus-header{display:flex;align-items:center;max-width:1480px;margin:auto;padding-right:28px;gap:8px}
.campus-switch{display:flex;align-items:center;gap:6px;flex:1;min-width:0;max-width:1480px;margin:0 auto;padding:8px 28px 0}
.campus-switch a{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:5px 12px;border:1px solid transparent;border-radius:11px;
  color:var(--muted-foreground);font-size:13px;font-weight:650;transition:background .16s,color .16s,border-color .16s}
.campus-switch a span[lang=en]{font-size:11px;letter-spacing:.02em;opacity:.72;font-weight:600}
.campus-switch a:hover,.campus-switch a[aria-current=page]{color:var(--primary);background:var(--background)}
.campus-switch a[aria-current=page]{border-color:var(--border)}
.campus-switch a[data-available=false]{opacity:.5}
.language-toggle{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:5px 11px;border:1px solid var(--border);border-radius:11px;
  background:var(--card);color:var(--muted-foreground);font-size:12px;font-weight:700;transition:.16s}
.language-toggle:hover{color:var(--primary);border-color:var(--primary);background:var(--accent)}
.language-toggle svg{width:15px;height:15px}
.language-toggle[data-on=true]{color:var(--primary);border-color:var(--primary);background:var(--accent)}
.masthead-inner{display:flex;align-items:center;gap:24px;max-width:1480px;height:76px;margin:auto;padding:0 28px}
.brand-title{margin:0;min-width:0;flex:none}
.wordmark{position:relative;display:flex;align-items:center;gap:12px;width:fit-content;max-width:100%}
.brand-mascot{width:40px;height:40px;transition:transform .18s var(--ease-out)}
.wordmark:hover .brand-mascot{transform:rotate(-8deg) translateY(-2px)}
.brand-lettering{display:flex;align-items:center;gap:3px;font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--foreground);white-space:nowrap}
.brand-bracket{color:var(--primary);font-weight:500;opacity:.75;font-size:22px}
.brand-en{font-size:13px;font-weight:650;letter-spacing:.01em;color:var(--muted-foreground);margin-left:8px}
.search-wrap{align-items:center;min-width:0;flex:1;display:flex;position:relative;max-width:560px}
.search-wrap>svg{width:18px;height:18px;color:var(--muted-foreground);pointer-events:none;position:absolute;left:15px}
.search-wrap input{border:1px solid var(--input);background:var(--card);width:100%;height:42px;color:var(--foreground);border-radius:999px;
  padding:0 40px 0 42px;font-size:14px;transition:border-color .16s,box-shadow .16s;outline:none}
.search-wrap input::placeholder{color:var(--muted-foreground)}
.search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.search-clear{position:absolute;right:9px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:var(--muted-foreground)}
.search-clear:hover{background:var(--muted);color:var(--foreground)}
.search-clear svg{width:15px;height:15px}
.header-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.source-link{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 11px;border:1px solid var(--border);border-radius:999px;
  background:var(--card);color:var(--muted-foreground);font-size:13px;font-weight:650;transition:.16s;white-space:nowrap}
.source-link svg{width:16px;height:16px}
.source-link:hover{color:var(--primary);border-color:var(--primary);background:var(--accent)}
.source-link[data-tone=amber]{color:#805c30;background:#fff8e9;border-color:transparent}
html[data-theme=dark] .source-link[data-tone=amber]{color:#f8d4a7;background:#3f383d}
.icon-button{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--border);border-radius:999px;background:var(--card);
  color:var(--muted-foreground);transition:.16s}
.icon-button svg{width:17px;height:17px}
.icon-button:hover{color:var(--primary);border-color:var(--primary);background:var(--accent)}
.theme-switch{display:flex;align-items:center;gap:4px}
.theme-switch .icon-button{background:var(--accent);border-color:transparent;color:var(--primary)}
html[data-theme=dark] .theme-to-dark{display:none}
html[data-theme=light] .theme-to-light{display:none}

/* ============ 分类导航(吸顶) ============ */
.board-main{max-width:1480px;width:100%;margin:0 auto;padding:0 28px 24px;outline:none;flex:1}
.board-navigation{position:sticky;top:0;z-index:20;padding:14px 0 10px;background:var(--background)}
.category-directory-layout{display:grid;grid-template-columns:80px minmax(0,1fr);align-items:stretch;gap:8px}
.category-root-all{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;width:100%;
  padding:10px 8px;border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--primary);font-size:13px;font-weight:700}
.category-root-all svg{width:19px;height:19px}
.category-root-all:hover{border-color:var(--primary);background:var(--accent)}
.category-root-all[aria-current=page]{color:var(--primary-foreground);background:var(--primary);border-color:var(--primary)}
.category-root-all,.category-root-all svg,.notice-block,.section-more svg,.brand-mascot{transition:transform .18s var(--ease-out)}
.category-root-all:hover:not([aria-current=page]) svg{transform:rotate(-10deg) scale(1.08)}
.category-root-all:active{transform:scale(.95)}
.category-clusters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:8px}
.category-cluster{min-width:0;min-height:0;padding:9px 10px 10px;border:1px solid var(--tone-edge);border-radius:16px;background:var(--tone-surface)}
.category-cluster-heading{display:flex;align-items:center;gap:8px;min-width:0;margin-bottom:8px;color:var(--tone-ink)}
.category-cluster-icon svg{width:17px;height:17px}
.category-cluster-heading strong{display:block;min-width:0;font-size:14px;line-height:1.35;font-weight:750}
.category-nav{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.category-nav a{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;gap:5px;min-height:32px;padding:0 9px;
  border:1px solid transparent;border-radius:10px;background:var(--card);color:var(--tone-ink);font-size:12px;font-weight:650;transition:.16s}
.category-nav svg{width:14px;height:14px}
.category-nav a:hover{border-color:var(--tone-ink);background:var(--tone-tint)}
.category-nav a[aria-current=page]{background:var(--tone-ink);color:var(--card);border-color:var(--tone-ink)}
.category-nav-all{opacity:.9}
.cat-label-long{display:none}

/* ============ 学习资料入口 ============ */
.study-strip{margin:0 0 14px}
.study-card{display:flex;align-items:center;gap:13px;width:100%;padding:12px 16px;text-align:left;
  border:1px solid var(--tone-edge);border-radius:16px;background:var(--tone-surface);color:var(--tone-ink);
  transition:transform .18s var(--ease-out),box-shadow .18s var(--ease-out),border-color .18s}
.study-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:var(--tone-ink)}
.study-card:active{transform:scale(.995)}
.study-mark{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:12px;background:var(--tone-tint)}
.study-mark svg{width:19px;height:19px}
.study-copy{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.study-copy strong{font-size:14.5px;font-weight:750;line-height:1.4}
.study-copy span{font-size:12.5px;line-height:1.5;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.study-meta{display:flex;align-items:center;gap:10px;flex:none}
.study-count{padding:3px 9px;border-radius:999px;background:var(--tone-tint);font:650 11.5px/1.6 var(--font-numbers);white-space:nowrap}
.study-go{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;white-space:nowrap}
.study-go svg{width:14px;height:14px;transition:transform .18s var(--ease-out)}
.study-card:hover .study-go svg{transform:translateX(2px)}
.study-list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.study-item{padding:14px 15px;border:1px solid var(--border);border-radius:14px;background:var(--muted)}
.study-item-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.study-item-head h4{margin:0;font-size:14.5px;font-weight:750;line-height:1.45}
.study-tag{padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--accent-foreground);font-size:10.5px;font-weight:700;white-space:nowrap}
.study-item p{margin:6px 0 0;font-size:13px;line-height:1.75;color:var(--muted-foreground)}
.study-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.study-link{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border:1px solid var(--border);border-radius:999px;
  background:var(--card);font-size:12px;font-weight:650;color:var(--foreground);transition:.16s}
.study-link:hover{border-color:var(--primary);color:var(--primary);background:var(--accent)}
.study-link svg{width:13px;height:13px}
.study-note{display:flex;align-items:flex-start;gap:7px;margin:16px 0 0;font-size:12.5px;line-height:1.8;color:var(--muted-foreground)}
.study-note svg{width:14px;height:14px;margin-top:3px;flex:none;color:var(--primary)}

/* ============ 工具栏 ============ */
.board-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;margin:0 0 14px;padding:2px 0}
.board-title{display:flex;align-items:center;min-width:0;gap:9px}
.board-title h2{margin:0;font-size:22px;font-weight:750;line-height:1.35;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-total{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 9px;border-radius:999px;background:var(--accent);
  color:var(--accent-foreground);font:700 12px/1 var(--font-numbers)}
.source-filter{display:flex;align-items:center;gap:6px}
.source-filter-label{color:var(--muted-foreground);font-size:12px;font-weight:650;margin-right:2px;white-space:nowrap}
.source-filter-pending{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 11px;border:1px dashed var(--border);
  border-radius:11px;color:var(--muted-foreground);font-size:13px;font-weight:600;white-space:nowrap}
.source-choice{position:relative;display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:6px 9px;border-radius:11px;
  color:var(--muted-foreground);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.16s}
.source-choice svg{width:15px;height:15px}
.source-choice[data-selected=true]{color:var(--tone-ink);background:var(--tone-tint)}
.source-choice input{appearance:none;flex:none;width:16px;height:16px;margin:0;border:1.5px solid var(--muted-foreground);border-radius:5px;
  background:var(--card);cursor:pointer;transition:.14s;position:relative}
.source-choice input:checked{background:var(--tone-ink);border-color:var(--tone-ink)}
.source-choice input:checked::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid var(--card);
  border-width:0 2px 2px 0;transform:rotate(45deg)}
.board-tools{display:flex;align-items:center;gap:8px}
.board-select{position:relative}
.board-select select{appearance:none;height:40px;padding:0 30px 0 13px;border:1px solid var(--border);border-radius:999px;background:var(--card);
  color:var(--foreground);font-size:13px;font-weight:600;cursor:pointer;transition:.16s;outline:none}
.board-select select:hover{border-color:var(--input);background:var(--accent);color:var(--primary)}
.board-select svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;pointer-events:none;color:currentColor;opacity:.6}
.refresh-button{width:40px;height:40px}
.refresh-button.spinning svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ 分区 & 卡片 ============ */
.board-results{position:relative;min-height:300px;scroll-margin-top:82px;display:flex;flex-direction:column;gap:14px}
.notice-section{min-width:0;padding:0 10px 10px;border:1px solid var(--tone-edge);border-radius:20px;background:var(--tone-surface)}
.section-heading{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 4px;color:var(--tone-ink)}
.section-icon svg{width:19px;height:19px}
.section-heading h2{margin:0;font-size:19px;font-weight:750;letter-spacing:.015em;white-space:nowrap}
.section-count{font:550 12px/1.5 var(--font-numbers);opacity:.95;white-space:nowrap}
.section-more{display:inline-flex;align-items:center;gap:5px;margin-left:auto;color:var(--tone-ink);font-size:12px;font-weight:650;
  padding:5px 9px;border-radius:9px;white-space:nowrap;transition:.16s}
.section-more svg{width:13px;height:13px}
.section-more:hover{background:var(--tone-tint)}
.notice-grid{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:7px;margin:0;padding:0;list-style:none}
.notice-block{position:relative;display:flex;align-items:center;width:100%;height:100%;min-height:74px;padding:10px 12px;border:1px solid transparent;
  border-radius:12px;background:var(--card);color:var(--foreground);text-align:left;box-shadow:var(--shadow-sm);transition:transform .18s var(--ease-out),border-color .18s}
.notice-block-copy{display:block;min-width:0;width:100%}
.notice-block-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:15px;font-weight:600;line-height:1.55;
  overflow-wrap:anywhere;transition:color .18s}
.notice-block-meta{display:flex;align-items:center;gap:10px;margin-top:6px;min-width:0;color:var(--muted-foreground);font-size:11.5px;flex-wrap:nowrap;overflow:hidden}
.notice-block-time,.notice-block-source{display:inline-flex;align-items:center;gap:5px;min-width:0}
.notice-block-time span,.notice-block-source span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice-block-source{flex:1 1 auto}
.notice-block:hover{border-color:var(--tone-ink);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.notice-block:hover .notice-block-title{color:var(--tone-ink)}
.notice-block:active{transform:scale(.985)}
.notice-block::after{content:"";position:absolute;top:14px;bottom:14px;left:0;width:3px;border-radius:999px;background:var(--tone-ink);opacity:0;transition:opacity .18s}
.notice-block:hover::after{opacity:.85}
.notice-block.is-new::before{content:"";position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.section-empty{padding:20px 8px;color:var(--tone-ink);font-size:13px;opacity:.85}
.board-empty{display:grid;place-items:center;gap:12px;min-height:320px;padding:40px 20px;text-align:center;color:var(--muted-foreground)}
.board-empty svg{width:44px;height:44px;opacity:.5}
.board-empty strong{color:var(--foreground);font-size:17px}
.board-empty p{margin:0;font-size:14px}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.filter-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:999px;
  background:var(--card);font-size:12.5px;font-weight:600;color:var(--muted-foreground);transition:.16s}
.filter-chip:hover{border-color:var(--primary);color:var(--primary);background:var(--accent)}
.board-results[aria-busy=true]::before{content:"";position:absolute;top:-5px;left:12px;right:12px;height:3px;background:var(--primary);
  border-radius:999px;z-index:1;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
mark.hit{background:color-mix(in srgb,var(--primary) 26%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* ============ 页脚 ============ */
.site-footer{max-width:1480px;width:100%;margin:0 auto;padding:22px 28px 40px;border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;color:var(--muted-foreground);font-size:12px}
.site-footer b{color:var(--foreground);font-weight:650}
.site-footer .dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5}

/* ============ 弹窗 ============ */
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100dvh;overflow:visible}
dialog::backdrop{background:color-mix(in srgb,#191320 62%,transparent);backdrop-filter:blur(3px)}
dialog[open]{animation:dlg .22s var(--ease-out)}
@keyframes dlg{from{opacity:0;transform:translateY(14px) scale(.985)}}
.modal-card{width:min(760px,calc(100vw - 32px));max-height:min(86dvh,900px);display:flex;flex-direction:column;border-radius:20px;
  background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-lg);overflow:hidden}
.detail-card{width:min(780px,calc(100vw - 32px));max-height:min(88dvh,940px);display:flex;flex-direction:column;border-radius:22px;
  background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-lg);overflow:hidden;position:relative}
.detail-card::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--tone-ink);opacity:.9}
.detail-head{padding:26px 26px 16px;border-bottom:1px solid var(--border);background:var(--tone-surface)}
.detail-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding-right:44px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge.cat{background:var(--tone-tint);color:var(--tone-ink)}
.badge.src{background:var(--card);color:var(--muted-foreground);border:1px solid var(--border)}
.badge svg{width:12px;height:12px}
.detail-title{margin:0;font-size:23px;line-height:1.45;font-weight:760;letter-spacing:-.015em;color:var(--foreground)}
.detail-en{margin:9px 0 0;font-size:13.5px;line-height:1.6;color:var(--muted-foreground);font-style:italic}
.detail-close{position:absolute;top:18px;right:18px;z-index:2}
.modal-close{position:absolute;top:16px;right:16px;z-index:2}
.detail-body{padding:20px 26px 24px;overflow:auto;display:flex;flex-direction:column;gap:20px}
.detail-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:0}
.meta-row{display:flex;align-items:flex-start;gap:9px;padding:11px 13px;border:1px solid var(--border);border-radius:13px;background:var(--muted)}
.meta-row svg{width:16px;height:16px;margin-top:2px;color:var(--primary);flex:none}
.meta-row dt{font-size:11px;font-weight:700;color:var(--muted-foreground);letter-spacing:.03em}
.meta-row dd{margin:1px 0 0;font-size:13.5px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.block-title{display:flex;align-items:center;gap:7px;margin:0 0 9px;font-size:12.5px;font-weight:750;letter-spacing:.05em;color:var(--muted-foreground)}
.block-title svg{width:15px;height:15px;color:var(--primary)}
.detail-summary{margin:0;padding:15px 17px;border-radius:14px;background:var(--accent);color:var(--accent-foreground);font-size:14.5px;line-height:1.8}
.detail-content{margin:0;font-size:14.5px;line-height:1.9;color:var(--foreground);white-space:pre-wrap;overflow-wrap:anywhere}
.attach-list{display:flex;flex-wrap:wrap;gap:7px;margin:0;padding:0;list-style:none}
.attach-list li{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--border);border-radius:11px;
  background:var(--muted);font-size:12.5px;color:var(--foreground);max-width:100%}
.attach-list li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-list svg{width:14px;height:14px;color:var(--muted-foreground)}
.detail-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:15px 26px;border-top:1px solid var(--border);background:var(--muted)}
.detail-hint{font-size:11.5px;color:var(--muted-foreground);flex:1;min-width:180px}
.detail-actions{display:flex;gap:8px;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:650;transition:.16s;border:1px solid transparent}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--primary);color:var(--primary-foreground)}
.btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{border-color:var(--border);background:var(--card);color:var(--foreground)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary);background:var(--accent)}
.modal-head{display:flex;align-items:center;gap:11px;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-head h2{margin:0;font-size:18px;font-weight:750}
.modal-head svg{width:19px;height:19px;color:var(--primary)}
.modal-body{padding:20px 24px 24px;overflow:auto;font-size:14px;line-height:1.75}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 20px}
.stat-tile{padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--muted)}
.stat-tile b{display:block;font:750 25px/1.25 var(--font-numbers);color:var(--primary)}
.stat-tile span{font-size:12px;color:var(--muted-foreground)}
.bar-row{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:11px;padding:5px 0;font-size:13px}
.bar-row .bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted-foreground);font-weight:600}
.bar-track{height:9px;border-radius:999px;background:var(--muted);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--tone-ink,var(--primary))}
.bar-row .bar-val{text-align:right;font:650 12px/1 var(--font-numbers);color:var(--muted-foreground)}
.src-group{margin-bottom:18px}
.src-group h3{margin:0 0 9px;font-size:12.5px;font-weight:750;letter-spacing:.04em;color:var(--muted-foreground)}
.src-chips{display:flex;flex-wrap:wrap;gap:6px}
.src-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:999px;
  background:var(--muted);font-size:12.5px;color:var(--foreground);transition:.16s}
.src-chip:hover{border-color:var(--primary);color:var(--primary);background:var(--accent)}
.src-chip em{font:650 11px/1 var(--font-numbers);color:var(--muted-foreground);font-style:normal}
.src-chip.is-pending{border-style:dashed;opacity:.75}
.src-chip.is-empty{border-style:dashed;opacity:.6}
.src-status{font-style:normal;font-size:10.5px;font-weight:700;line-height:1.5;padding:1px 6px;border-radius:999px;white-space:nowrap}
.src-status[data-status=ok]{color:var(--primary);background:var(--accent)}
.src-status[data-status=idle]{color:var(--muted-foreground);background:var(--muted)}
.src-status[data-status=bad]{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
.src-summary{margin:0 0 14px;font-size:13px;color:var(--muted-foreground);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.src-summary b{color:var(--foreground)}
.src-summary .dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5}
.notice-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.notice-list button{text-align:left;width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--muted);transition:.16s}
.notice-list button:hover{border-color:var(--primary);background:var(--accent)}
.notice-list b{display:block;font-size:13.5px;font-weight:600;line-height:1.55}
.notice-list span{display:block;margin-top:4px;font-size:11.5px;color:var(--muted-foreground)}
.empty-note{padding:26px;text-align:center;color:var(--muted-foreground);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,26px);z-index:300;padding:11px 18px;border-radius:999px;
  background:var(--foreground);color:var(--background);font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;
  pointer-events:none;transition:opacity .22s,transform .22s}
.toast[data-show=true]{opacity:1;transform:translate(-50%,0)}

/* ============ 响应式 ============ */
@media (max-width:1240px){
  .source-link span{display:none}
  .source-link{padding:6px 9px}
}
@media (max-width:1080px){
  .masthead-inner{display:grid;grid-template-columns:minmax(0,1fr) auto;height:auto;padding:13px 20px;gap:12px 16px}
  .brand-title{grid-column:1/-1;justify-self:center}
  .search-wrap{max-width:none;grid-column:1}
  .header-actions{grid-column:2}
  .board-main{padding-inline:20px}
}
@media (max-width:860px){
  .campus-switch{padding:8px 14px 0;gap:2px}
  .campus-switch a{padding:5px 9px;font-size:12px}
  .campus-switch a span[lang=en]{display:none}
  .campus-header{padding-right:14px}
  .masthead-inner{padding:12px 14px;gap:11px 8px}
  .brand-mascot{width:34px;height:34px}
  .brand-lettering{font-size:20px}
  .brand-en{display:none}
  .board-main{padding:0 12px 18px}
  .board-navigation{position:static;padding:8px 0 5px}
  .notice-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .notice-block{padding:9px 11px;min-height:74px}
  .notice-block-title{font-size:14px}
  .notice-block-meta{gap:6px;font-size:11px}
  .category-directory-layout{grid-template-columns:1fr}
  .category-root-all{flex-direction:row;gap:5px;min-height:44px;padding:7px 5px;border-radius:12px}
  .category-root-all svg{width:16px;height:16px}
  .category-clusters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .category-cluster{padding:7px 8px 8px}
  .category-cluster-heading strong{font-size:13px}
  .category-nav a{min-height:30px;padding:0 8px;font-size:11.5px}
  .cat-label-long{display:none}
  .cat-label-short{display:inline}
  .board-toolbar{grid-template-columns:minmax(0,1fr) auto;gap:8px 10px}
  .board-title h2{font-size:18px}
  .source-filter{order:3;grid-column:1/-1}
  .board-tools{order:2}
  .board-select select{padding:0 26px 0 11px;font-size:12px;height:38px}
  .refresh-button{width:38px;height:38px}
  .site-footer{padding:18px 14px 34px}
  .detail-head,.detail-body,.detail-foot{padding-left:17px;padding-right:17px}
  .detail-title{font-size:19px}
}
@media (max-width:560px){
  .category-clusters{grid-template-columns:1fr}
  .source-filter-label{display:none}
  .board-select[data-hide-sm]{display:none}
  .study-card{padding:11px 13px;gap:10px}
  .study-copy span{white-space:normal}
  .study-count{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div class="app-shell" data-campus="xjtu">
  <a class="skip-link" href="#notices">跳转至通知列表</a>

  <header class="masthead">
    <div class="campus-header">
      <nav class="campus-switch" aria-label="校园切换" id="campus-switch"></nav>
      <button class="language-toggle" id="lang-toggle" aria-label="Switch to English" title="切换中英文标题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        <span>EN</span>
      </button>
    </div>
    <div class="masthead-inner">
      <h1 class="brand-title">
        <a class="wordmark" href="#" id="brand-link" aria-label="返回首页">
          <svg class="brand-mascot" viewBox="0 0 32 32" aria-hidden="true">
            <defs><linearGradient id="mascotGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a56ebd"/><stop offset="1" stop-color="#6b3d8c"/>
            </linearGradient></defs>
            <rect x="2" y="2" width="28" height="28" rx="9.5" fill="url(#mascotGrad)"/>
            <circle cx="12" cy="13.6" r="2.5" fill="#fff"/>
            <circle cx="20" cy="13.6" r="2.5" fill="#fff"/>
            <circle cx="12.8" cy="14.4" r="1.15" fill="#3a2050"/>
            <circle cx="20.8" cy="14.4" r="1.15" fill="#3a2050"/>
            <path d="M11.4 20.4c1.4 2 3 3 4.6 3s3.2-1 4.6-3" stroke="#fff" stroke-width="1.9" fill="none" stroke-linecap="round"/>
            <path d="M25.2 5.6l.85 2.05 2.05.85-2.05.85-.85 2.05-.85-2.05-2.05-.85 2.05-.85z" fill="#ffd98e"/>
          </svg>
          <span class="brand-lettering">
            <span class="brand-bracket" aria-hidden="true">「</span><span id="brand-name">西交知道</span><span class="brand-en" id="brand-en">XJTU Know</span><span class="brand-bracket" aria-hidden="true">」</span>
          </span>
        </a>
      </h1>
      <label class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="sr-only">搜索标题、公众号或发布单位</span>
        <input id="q" type="search" placeholder="搜索通知" autocomplete="off" spellcheck="false">
        <button class="search-clear" id="q-clear" type="button" aria-label="清空搜索" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </label>
      <div class="header-actions board-header-actions">
        <button class="source-link" data-open="upcoming" type="button" aria-label="近期活动" title="近期活动">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
          <span>活动日历</span>
        </button>
        <button class="source-link" data-tone="amber" data-open="suggest" type="button" aria-label="信息源补充" title="信息源补充">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 15.5A2 2 0 0 0 8.5 14.06l-6.14-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.14a.5.5 0 0 1 .96 0l1.58 6.14a2 2 0 0 0 1.44 1.44l6.14 1.58a.5.5 0 0 1 0 .96l-6.14 1.58a2 2 0 0 0-1.44 1.44l-1.58 6.14a.5.5 0 0 1-.96 0z"/></svg>
          <span>信息源补充</span>
        </button>
        <button class="source-link" data-open="sources" type="button" aria-label="信息来源" title="信息来源">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/></svg>
          <span>信息来源</span>
        </button>
        <button class="icon-button" data-open="stats" type="button" aria-label="数据概览" title="数据概览">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
        </button>
        <div class="theme-switch">
          <button class="icon-button theme-to-dark" id="theme-dark" type="button" aria-label="切换到夜间模式" title="切换到夜间模式">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
          <button class="icon-button theme-to-light" id="theme-light" type="button" aria-label="切换到白天模式" title="切换到白天模式">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          </button>
        </div>
        <button class="icon-button" data-open="about" type="button" aria-label="交流群与网站信息" title="交流群与网站信息">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="notices" class="board-main" tabindex="-1">
    <div class="board-navigation">
      <nav class="category-directory" aria-label="分类导航">
        <div class="category-directory-layout">
          <a class="category-root-all" id="cat-all" href="#" data-scope="all" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="14" rx="1.5"/><rect width="7" height="7" x="3" y="14" rx="1.5"/></svg>
            <span>全部</span>
          </a>
          <div class="category-clusters" id="clusters"></div>
        </div>
      </nav>
    </div>

    <section class="study-strip" id="study-strip" data-tone="amber" aria-label="学习资料汇总入口" hidden>
      <button class="study-card" id="study-open" type="button">
        <span class="study-mark" id="study-mark" aria-hidden="true"></span>
        <span class="study-copy">
          <strong id="study-title"></strong>
          <span id="study-desc"></span>
        </span>
        <span class="study-meta">
          <span class="study-count" id="study-count"></span>
          <span class="study-go">查看 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span>
        </span>
      </button>
    </section>

    <div class="board-toolbar">
      <div class="board-title">
        <h2 id="board-title-text">全部通知</h2>

      p = fetch(path, { cache: "force-cache" }).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
    }
    // 失败的请求不缓存，下次还能重试

  }

  /* ---------- 分类配置(顺序 / 色调 / 图标 / 所属分组) ---------- */
  var CATEGORY_META = [
    { name:"文体活动", tone:"lilac", icon:"ticket",       group:"activity",    short:"文体" },
    { name:"社团公益", tone:"peach", icon:"users",        group:"activity",    short:"社团" },
    { name:"讲座活动", tone:"water", icon:"presentation", group:"activity",    short:"讲座" },
    { name:"学习成长", tone:"amber", icon:"book",         group:"activity",    short:"学习" },
    { name:"实习就业", tone:"rose",  icon:"briefcase",    group:"activity",    short:"就业" },
    { name:"交流访学", tone:"slate", icon:"plane",        group:"activity",    short:"留学" },
    { name:"校园动态", tone:"amber", icon:"landmark",     group:"information", short:"校园" },
    { name:"学术科研", tone:"water", icon:"flask",        group:"information", short:"科研" },
    { name:"院系资讯", tone:"lilac", icon:"building",     group:"information", short:"院系" },
    { name:"生活资讯", tone:"peach", icon:"coffee",       group:"information", short:"生活" },

    { name:"校园服务", tone:"water", icon:"buoy",         group:"information", short:"服务" }
  ];
  var META_OF = {};
  CATEGORY_META.forEach(function (m) { META_OF[m.name] = m; });
  var TONE_FALLBACK = ["lilac","peach","water","amber","rose","slate","iris","ochre"];
  function metaOf(cat, idx) {
    if (META_OF[cat]) return META_OF[cat];

  }

  var CAMPUS_NAMES = {
    thu:{ zh:"清华知道", en:"THU Know", ext:"https://pkuknow.cn/thu" },

  /* ---------- 学习资料汇总（本站只做索引，资料本体都在各校学生社区的仓库/站点） ----------
     清单在 data/study/materials.json，构建时注入上面的 #study-data。
     想加/改链接请改那个 JSON，再跑 python refresh.py --build-only，不要在这里改代码。
     没有配置的校区（如「清华知道」是外链）不显示入口。 */
  var STUDY = (function () {
    var raw = "";
    try { raw = document.getElementById("study-data").textContent || ""; } catch (e) { /* 无节点 */ }
    if (!raw || raw.indexOf("__STUDY_") === 0) return {};   // 模板未构建：静默隐藏入口
    try {

  })();

  // 数据里多出来的校区自动补进切换栏:以后加校区只要放一份 data/<key>.json
  Object.keys(PAYLOAD.campuses || {}).forEach(function (key) {
    if (CAMPUS_ORDER.indexOf(key) >= 0) return;

  });

  /* ---------- 数据整理 ---------- */
  var CAMPUSES = PAYLOAD.campuses || {};
  var ACTIVE = PAYLOAD.default_campus || Object.keys(CAMPUSES)[0] || "xjtu";
  if (!CAMPUSES[ACTIVE]) CAMPUSES[ACTIVE] = { campus:ACTIVE, items:[], sources:[], groups:[] };

  var CATEGORY_ORDER = CATEGORY_META.map(function (m) { return m.name; });
  var ITEM_POOL = [];                    // 原始条目池,保留 _key/_ix 以便按需回填

  // 保留期:发布超过 90 天的内容自动清除(与 refresh.py 的 RETENTION_DAYS 一致)。

  var RETENTION_DAYS = 90;
  var RETENTION_CUTOFF = Date.now() - RETENTION_DAYS * 86400000;
  var PRUNED_OF = {};

  Object.keys(CAMPUSES).forEach(function (key) {
    var c = CAMPUSES[key];
    (c.items || []).forEach(function (raw) {
      var it = Object.assign({}, raw);
      it._campus = key;
      // 发布时间缺失时退回活动开始时间;两者都没有才记为 0(未知时间)
      it._ts = Date.parse(it.d) || Date.parse(it.dt && it.dt.ev && it.dt.ev[0]) || 0;
      // 超过保留期的历史条目不再进入页面:计数、来源、分类、搜索里都不会出现
      if (it._ts && it._ts < RETENTION_CUTOFF) {
        PRUNED_OF[key] = (PRUNED_OF[key] || 0) + 1;
        return;
      }
      normalize(it);
      ITEM_POOL.push(it);
      allItems.push(it);
    });
  });
  CATEGORY_ORDER = CATEGORY_ORDER.filter(function (v, i, a) { return a.indexOf(v) === i; });

  // 预计算字段:筛选与渲染都靠它,必须在 index 里
